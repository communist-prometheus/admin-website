name: Deploy comms-worker to Cloudflare Workers

on:
  push:
    branches: [master, develop]
    paths:
      - 'services/comms-worker/**'
      - 'specs/comms-newsletter/**'
      - '.github/workflows/deploy-comms-worker.yml'

concurrency:
  group: deploy-comms-worker-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN - deploys use dedicated secrets,
# nothing here needs repo write access via the ambient token.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning git repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The develop worker (dev-lists.comprom.org) used to be deployed by
      # hand, so dev-admin talked to a build months behind master. Pick the
      # target from the branch instead.
      - name: Resolve branch env
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            echo "D1_NAME=comms-develop" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV=--env develop" >> "$GITHUB_ENV"
          else
            echo "D1_NAME=comms-prod" >> "$GITHUB_ENV"
            echo "WRANGLER_ENV=" >> "$GITHUB_ENV"
          fi

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9

      - name: Install root dependencies (provides hono, wrangler, cron-parser)
        run: bun install --frozen-lockfile

      - name: Run comms-worker unit + integration tests
        run: bun run test:unit -- run services/comms-worker/

      - name: Audit EARS coverage
        run: bun scripts/comms-spec-coverage.ts

      # The develop D1 binding is declared inside `env.develop`, so the
      # migrations command needs the same `--env` the deploy gets —
      # without it wrangler reports "Couldn't find a D1 DB with the name
      # or binding 'comms-develop'".
      # `migrations apply` tracks state in the d1_migrations table and
      # only runs pending files — the previous `d1 execute` loop re-ran
      # every migration on every deploy and died on "table already
      # exists" (and would have duplicated seed rows had it not).
      - name: Apply D1 migrations
        run: |
          cd services/comms-worker
          npx wrangler d1 migrations apply "$D1_NAME" --remote $WRANGLER_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          cd services/comms-worker
          npx wrangler deploy $WRANGLER_ENV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
